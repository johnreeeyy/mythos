<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythos</title>

  <link rel="icon" type="image/png" href="icons/icons8-ancient-62.png">

  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/gods.css">
  <link rel="stylesheet" href="styles/modal.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=GFS+Neohellenic:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">

  <script src="scripts/data.js"></script>
  <script src="scripts/app.js" defer></script>

</head>

<body>
  <div class="header-container">
    <header>
      <img src="icons/icons8-ancient-62.png" alt="" onclick="">
      <div class="searchbar-container">
        <input class="searchbar" type="text" placeholder="Search a God">
      </div>
      <h1>Mythos</h1>
    </header>
    <div class="filter-buttons">
      <button class="active">All</button>
      <button>Norse</button>
      <button>Greek</button>
    </div>
    <button class="favorites-toggle">
      ★ Favorites
    </button>
  </div>

  <div class="gods-container"></div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">

      <div class="modal-header">
        <h1>Zeus</h1>
        <button class="close-button">X</button>
      </div>

      <div class="modal-content">
        <div class="left-content">
          <img src="images/Zeus.webp" alt="">
        </div>

        <div class="right-content">
          <section class="god-domain">
            <h3>Domains</h3>
            <ul>
              <li></li>
              <li></li>
              <li></li>
              <li></li>
            </ul>
          </section>

          <section class="god-symbol">
            <h3>Symbols</h3>
            <ul>
              <li></li>
              <li></li>
              <li></li>
              <li></li>
            </ul>
          </section>

          <section class="god-trivia">
            <h3>Trivia</h3>
            <p></p>
          </section>

          <section class="god-lore">
            <h3>Lore</h3>
            <p>

            </p>
          </section>

        </div>
      </div>
    </div>
  </div>

</body>

</html>
